name: Terraform Lint, Security, Plan, Policy & Cost

on: [push]

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      # ----- Checkout -----
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ----- AWS -----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      # ----- Terraform Setup -----
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.0

      # ----- Linting -----
      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run TFLint
        run: tflint --init && tflint --recursive

      # ----- Security -----
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          hide-progress: true
          output: trivy.txt

      - name: Publish Trivy Output to Summary
        run: |
          if [[ -s trivy.txt ]]; then
            {
              echo "### Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

      # ----- Terraform Init & Plan -----
      - name: Terraform Init
        run: cd ./terraform && terraform init

      - name: Terraform Plan
        run: cd ./terraform && terraform plan -out=tfplan.binary -no-color

      - name: Save Terraform Plan Output
        run: cd ./terraform && terraform show -json tfplan.binary > tfplan.json

      # ----- OPA Policy Check -----
      - name: Install OPA & Conftest
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa && sudo mv opa /usr/local/bin/
          curl -L https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/

      - name: Run OPA Policy Checks
        run: |
          mkdir -p policy
          # Example: You should have policy/*.rego files committed
          cd ./terraform
          conftest test tfplan.json --policy ../policy || echo "OPA Policy Violations Found"
        
      - name: Publish OPA Policy Check Results
        run: |
          echo "### OPA Policy Check Results" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          conftest test ./terraform/tfplan.json --policy ./policy || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ----- Infracost Setup -----
      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Cost Estimate
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json
