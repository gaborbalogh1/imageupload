name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
      region:
        description: "AWS region"
        required: true
        default: "eu-west-1"
      port_context:
        description: "Metadata from Port.io"
        required: false
        default: "{}"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display inputs
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Region: ${{ github.event.inputs.region }}"

      - name: Deploy to AWS
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }} in region ${{ github.event.inputs.region }}"
          # insert your deployment command here (e.g. terraform apply, aws deploy, etc.)
